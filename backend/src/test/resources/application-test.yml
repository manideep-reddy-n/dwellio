spring:
  datasource:
    url: jdbc:h2:mem:dwellio-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

dwellio:
  dev:
    seed-demo-data: false
  jwt:
    secret: test-secret-key-with-at-least-32-characters
    access-token-expiration: PT15M
    refresh-token-expiration: P7D
    password-reset-expiration: PT1H
