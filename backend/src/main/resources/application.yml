spring:
  application:
    name: dwellio-api
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-init-sql: SET search_path TO ${DATABASE_SCHEMA:dwellio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:dwellio}
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    schemas: ${DATABASE_SCHEMA:dwellio}
    default-schema: ${DATABASE_SCHEMA:dwellio}
    create-schemas: true

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1

logging:
  level:
    com.dwellio: INFO
    org.hibernate.SQL: WARN

dwellio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  app:
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cloudinary:
    url: ${CLOUDINARY_URL:}
  dev:
    seed-demo-data: ${SEED_DEMO_DATA:false}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
    password-reset-expiration: PT1H
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@dwellio.local}
