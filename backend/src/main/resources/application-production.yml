spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  flyway:
    clean-disabled: true
    # Supabase public schema may contain other apps; keep Dwellio isolated.
    schemas: ${DATABASE_SCHEMA:dwellio}
    default-schema: ${DATABASE_SCHEMA:dwellio}
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:dwellio}

server:
  forward-headers-strategy: framework

dwellio:
  dev:
    seed-demo-data: false
  jwt:
    secret: ${JWT_SECRET}
